name: Deploy

# Triggered when someone comments "/approve" on a deployment approval issue.
# No CI minutes are burned while waiting for approval — this only fires on the comment event.
on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  deploy:
    # Only run if: comment is "/approve" AND issue has "deployment" label AND issue is open
    if: |
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'deployment') &&
      github.event.comment.body == '/approve'
    runs-on: ubuntu-latest
    steps:
      - name: React to comment
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Check commenter has write permission
        uses: actions/github-script@v9
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const allowed = ['admin', 'write'].includes(perm.permission);
            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${context.actor} does not have write permission and cannot approve deployments.`
              });
              core.setFailed(`${context.actor} has permission level '${perm.permission}' — write or admin required`);
            }

      - name: Parse deployment details from issue body
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body;

            // Extract values from the markdown table in the issue body
            const appMatch = body.match(/\*\*App\*\*\s*\|\s*`([^`]+)`/);
            const stageMatch = body.match(/\*\*Stage\*\*\s*\|\s*`([^`]+)`/);
            const commitMatch = body.match(/\*\*Commit\*\*\s*\|\s*`([^`]+)`/);

            if (!appMatch || !stageMatch || !commitMatch) {
              core.setFailed('Could not parse deployment details from issue body');
              return;
            }

            // These three values come out of an issue body — attacker-influenced text — and are
            // then used to build a shell command and a deploy target. `[^`]+` accepts everything
            // except a backtick, which includes `;`, `$(…)` and newlines, so the regex alone is
            // not a constraint. Validate against closed sets before anything downstream sees
            // them: an app must be a real deployable, a stage must be one we deploy to, and a
            // commit must be a full hex SHA. Anything else fails the run rather than being
            // sanitised, because there is no legitimate way for a malformed value to get here.
            // No app currently has a `trigger-deploy` nx target — add its name here when one does.
            const DEPLOYABLE_APPS = [];
            const DEPLOY_STAGES = ['production', 'staging'];

            const app = appMatch[1];
            const stage = stageMatch[1];
            const sha = commitMatch[1];

            if (!DEPLOYABLE_APPS.includes(app)) {
              core.setFailed(`'${app}' is not a deployable app`);
              return;
            }
            if (!DEPLOY_STAGES.includes(stage)) {
              core.setFailed(`'${stage}' is not a deployable stage`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('Commit in the issue body is not a full 40-character SHA');
              return;
            }

            core.setOutput('app_name', app);
            core.setOutput('stage', stage);
            core.setOutput('trigger_sha', sha);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Approved by @${context.actor}. Deployment of \`${appMatch[1]}\` to \`${stageMatch[1]}\` is starting.`
            });

      # FR-070 asks that a deployment record who approved it, which commit and
      # which stage. The approval issue carries the app, the stage and the
      # commit, and the comment carries the approver — but the issue is closed on
      # success and is not part of the run. Writing all four to the run summary
      # is what keeps the approval auditable from the deployment itself once the
      # issue is gone. This records the approval; it does not gate it. The gate
      # is the write-permission check above, and there is deliberately no second
      # one here.
      - name: Record approver on the run
        uses: actions/github-script@v9
        env:
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          STAGE: ${{ steps.parse.outputs.stage }}
          TRIGGER_SHA: ${{ steps.parse.outputs.trigger_sha }}
        with:
          script: |
            const app = process.env.APP_NAME;
            const stage = process.env.STAGE;
            const sha = process.env.TRIGGER_SHA;
            const approver = context.actor;

            await core.summary
              .addHeading('Deployment approval', 2)
              .addTable([
                [
                  { data: 'Field', header: true },
                  { data: 'Value', header: true },
                ],
                ['Approved by', `@${approver}`],
                ['App', app],
                ['Stage', stage],
                ['Commit', sha],
                ['Approval issue', `#${context.issue.number}`],
                ['Approved at', new Date().toISOString()],
              ])
              .write();

            core.notice(`${app} → ${stage} at ${sha} approved by @${approver}`);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.parse.outputs.trigger_sha }}
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Both values are validated against closed sets in `parse` above. They are still passed
      # through `env:` and quoted rather than interpolated into the command, so that the
      # validation is a second line of defence and not the only one — a `${{ }}` here would be
      # substituted into the shell before it ever ran.
      - name: Deploy
        run: pnpm exec nx run "$APP_NAME:deploy" --configuration="$STAGE"
        env:
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          STAGE: ${{ steps.parse.outputs.stage }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Report outcome
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          STAGE: ${{ steps.parse.outputs.stage }}
        with:
          script: |
            // Read from the environment rather than interpolating. A `${{ }}` inside a JS string
            // literal is substituted before the script parses, so a single quote in the value
            // would close the literal and the rest would run as code — in a step holding a
            // repository token.
            const success = process.env.JOB_STATUS === 'success';
            const app = process.env.APP_NAME;
            const stage = process.env.STAGE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: success
                ? `Deployment of \`${app}\` to \`${stage}\` completed successfully.`
                : `Deployment of \`${app}\` to \`${stage}\` failed. [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

            if (success) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
