name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all apps (ignore affected — deploy every project with a trigger-deploy target)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  qlty:
    # Code-health gate for the PR diff: lint & security (qlty check) plus
    # duplication & complexity (qlty smells). Fails when the changed files
    # breach a threshold — all thresholds live in
    # tooling/qlty-diff/src/config.ts (override per-run with the QLTY_* env vars).
    # Independent of the nx job below: qlty is not nx-aware and does its own
    # git-based change detection.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Code-health gate (lint, security, duplication, complexity)
        run: pnpm qlty:diff "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  main:
    runs-on: ubuntu-latest
    outputs:
      deploy-needed: ${{ steps.check-deploy.outputs.deploy-needed }}
      affected-apps: ${{ steps.check-deploy.outputs.affected-apps }}

    # A real Postgres, because roughly a third of this repository's assertions cannot be made
    # without one and were previously reported as green by never running (FR-204, SC-064): the
    # exactly-once unique index, the branch-lock advisory lock, the iteration CHECK constraint,
    # profile-scoped spend and the skill-digest readback are all properties of the database, not of
    # application code, and a fake proves nothing about any of them.
    #
    # 17 matches the engine version the deployed instance runs
    # (`buildDatabaseSpecification` in packages/sisyphus-infra/src/database.ts pins `17.4`), so a
    # constraint or a lock that behaves differently across majors is caught here rather than on a
    # stage. The image's superuser is what lets the fixtures `create database` a private scratch
    # database per suite and `drop … with (force)` it afterwards.
    #
    # cspell:ignore isready dbname
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sisyphus
          POSTGRES_PASSWORD: sisyphus
          POSTGRES_DB: sisyphus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username sisyphus --dbname sisyphus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Set for the whole job rather than the test step alone: the migrate step below has to point
      # at the same database, and two literals that must agree is how they stop agreeing.
      SISYPHUS_TEST_DATABASE_URL: postgres://sisyphus:sisyphus@localhost:5432/sisyphus

    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Most suites create and migrate a private scratch database of their own, but not all of
      # them: the panel's sign-in and log-stream suites connect straight to the configured database
      # because what they assert is the SQL against the real tables. So the configured database has
      # to carry the schema before any test runs.
      #
      # This runs the same `sisyphus-api:migrate` command a stage is migrated with (FR-010), which
      # makes it a second assertion for free: a migration that does not apply cleanly to an empty
      # database fails the build here rather than during a deploy.
      - name: Apply migrations to the CI database
        run: pnpm exec nx run sisyphus-api:migrate
        env:
          SISYPHUS_DATABASE_URL: ${{ env.SISYPHUS_TEST_DATABASE_URL }}

      # `design-lint` joins the affected run rather than living in a separate job or a second CI
      # provider: splitting the blocking gates across two systems leaves one of them not running it
      # (FR-069). Projects without the target are simply skipped by `nx affected`.
      - run: pnpm exec nx affected -t lint test typecheck design-lint --parallel=$(nproc)

      # The assembly gate (SC-063). A module that is implemented, exported through a barrel and
      # unit-tested, but imported by nothing outside its own tests, is invisible to every check
      # above: it compiles, it lints, and its suite passes. That is exactly how a shipped feature
      # reaches a stage with no caller — and it is the shape of defect the executor, the log viewer
      # and the supervision panel each arrived in.
      #
      # `--production` is what makes it visible: knip drops test files and every non-production
      # entry, so a module's own suite no longer counts as a caller. It only works because the
      # entry and project patterns in `knip.json` carry the `!` production suffix — without the
      # suffix knip resolves an empty entry set, analyses nothing, and exits zero. If this step
      # ever starts passing suspiciously fast, check that first.
      #
      # Not part of `nx affected`: knip is not nx-aware and the condition is global — the caller
      # that went missing usually lives in a project the diff never touched.
      - name: Assembly gate (every shipped module has a production caller)
        run: pnpm knip:orphans

      - name: Check if deploy is needed
        id: check-deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          # `nx show projects` prints a JSON array whenever stdout is not a
          # terminal, which it never is here — so ask for JSON explicitly and
          # parse it as JSON. Splitting that output on newlines yields a single
          # "app" whose name is the whole array, and every app is then silently
          # never deployed while this job still reports success.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            # Manual trigger with deploy_all: target every project that has trigger-deploy, not just affected
            AFFECTED=$(pnpm exec nx show projects --withTarget=trigger-deploy --json 2>/dev/null || echo "[]")
          else
            # List affected projects that have a trigger-deploy target
            AFFECTED=$(pnpm exec nx show projects --affected --withTarget=trigger-deploy --json 2>/dev/null || echo "[]")
          fi
          JSON=$(printf '%s' "$AFFECTED" | jq -c 'map(select(length > 0))')
          COUNT=$(printf '%s' "$JSON" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            echo "affected-apps=$JSON" >> "$GITHUB_OUTPUT"
            echo "Deploy needed for: $JSON"
          else
            echo "deploy-needed=false" >> "$GITHUB_OUTPUT"
            echo "affected-apps=[]" >> "$GITHUB_OUTPUT"
            echo "No deployment needed"
          fi

  dispatch-deploy:
    needs: main
    if: needs.main.outputs.deploy-needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    strategy:
      matrix:
        app: ${{ fromJson(needs.main.outputs.affected-apps) }}
    steps:
      - name: Determine stage
        id: stage
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "stage=production" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/staging" ]; then
            echo "stage=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Create approval issue
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const app = '${{ matrix.app }}';
            const stage = '${{ steps.stage.outputs.stage }}';
            const sha = context.sha;

            // Close any existing open approval issue for the same app+stage
            // to avoid stale deployments being approved
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `deployment,${stage}`,
              per_page: 100,
            });

            for (const issue of existing.data) {
              const appMatch = issue.body?.match(/\*\*App\*\*\s*\|\s*`([^`]+)`/);
              if (appMatch?.[1] === app) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Superseded by a newer deployment (commit \`${sha}\`). Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
                core.notice(`Closed superseded issue #${issue.number}`);
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy Approval: ${app} → ${stage}`,
              body: [
                `## Deployment Request`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **App** | \`${app}\` |`,
                `| **Stage** | \`${stage}\` |`,
                `| **Commit** | \`${sha}\` |`,
                `| **Branch** | \`${process.env.REF_NAME}\` |`,
                `| **Triggered by** | @${context.actor} |`,
                ``,
                `---`,
                ``,
                `### To approve, comment \`/approve\``,
                `### To reject, close this issue`,
                ``,
                `> Commenting \`/approve\` triggers the deployment immediately. No CI minutes are burned while waiting.`,
                `>`,
                `> If the deployment fails, this issue remains open. Comment \`/approve\` again to retry against the same commit.`,
              ].join('\n'),
              labels: ['deployment', stage]
            });
            core.notice(`Approval issue created: #${issue.data.number}`);
