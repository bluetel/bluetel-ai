identity:
  name: submit_task
  author: chalkboard
  label:
    en_US: Submit Task (async)
description:
  human:
    en_US: Submit a coding task to the worker and return immediately with the task id. Combine with "Get Task Result" to collect the outcome later.
  llm: Submits a coding task to a remote coding agent (AWS Kiro by default) without waiting for completion. Returns a task_id that can be passed to the get_task_result tool to retrieve the outcome and session logs later.
parameters:
  - name: repo_url
    type: string
    required: true
    form: llm
    label:
      en_US: Repository URL
    human_description:
      en_US: GitHub repository HTTPS URL (https://github.com/{owner}/{repo})
    llm_description: The GitHub repository HTTPS URL to work in, in the form https://github.com/{owner}/{repo}.
  - name: base_branch
    type: string
    required: true
    default: main
    form: llm
    label:
      en_US: Base branch
    human_description:
      en_US: Branch to clone and base the work on (e.g. main)
    llm_description: The git branch to clone and base the work on, e.g. main.
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Task prompt
    human_description:
      en_US: The task instruction for the coding agent
    llm_description: The task instruction for the coding agent. Describe what should be implemented or fixed.
  - name: context
    type: string
    required: false
    form: llm
    label:
      en_US: Context from previous step
    human_description:
      en_US: Optional context handed over from a previous workflow node
    llm_description: Optional additional context for the task, such as findings or output from a previous step.
  - name: acceptance_criteria
    type: string
    required: false
    form: llm
    label:
      en_US: Acceptance criteria
    human_description:
      en_US: Optional conditions the change must satisfy
    llm_description: Optional acceptance criteria the implemented change must satisfy.
  - name: engine
    type: select
    required: false
    default: kiro
    form: form
    label:
      en_US: Engine
    human_description:
      en_US: Which coding agent engine executes the task
    options:
      - value: kiro
        label:
          en_US: AWS Kiro
      - value: copilot
        label:
          en_US: GitHub Copilot CLI
      - value: claude
        label:
          en_US: Claude Code
  - name: agent
    type: string
    required: false
    form: form
    label:
      en_US: Agent
    human_description:
      en_US: Kiro CLI agent name to use (e.g. spec-orchestrator). Ignored by engines without agent support.
  - name: model
    type: string
    required: false
    form: form
    label:
      en_US: Model
    human_description:
      en_US: Model identifier forwarded to the engine (e.g. claude-sonnet-4-6). Ignored by engines without model support.
  - name: install_script
    type: string
    required: false
    form: form
    label:
      en_US: Install script
    human_description:
      en_US: Optional shell script to install dependencies. When omitted, the worker runs an LLM-driven setup phase.
output_schema:
  type: object
  properties:
    task_id:
      type: string
      description: Worker task identifier to pass to get_task_result
    status:
      type: string
      description: Initial task status (normally working)
    success:
      type: boolean
      description: True when the task was accepted by the worker
    error:
      type: string
      description: Error description when submission failed
    engine:
      type: string
      description: Engine selected for the task
    warnings:
      type: array
      items:
        type: string
      description: Parameters that were ignored by the selected engine
extra:
  python:
    source: tools/submit_task.py
