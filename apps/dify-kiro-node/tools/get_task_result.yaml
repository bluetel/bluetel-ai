identity:
  name: get_task_result
  author: bluetel-ai
  label:
    en_US: Get Task Result
description:
  human:
    en_US: Fetch the current status, result summary, and session logs of a previously submitted worker task.
  llm: Fetches the current state of a previously submitted coding agent task by task_id, including status, result summary, and the full execution session logs. Use after submit_task, or to re-fetch logs for a completed task.
parameters:
  - name: task_id
    type: string
    required: true
    form: llm
    label:
      en_US: Task ID
    human_description:
      en_US: The task id returned by Submit Task or Delegate Task
    llm_description: The worker task identifier returned by the submit_task or delegate_task tool.
  - name: include_logs
    type: boolean
    required: false
    default: true
    form: form
    label:
      en_US: Include session logs
    human_description:
      en_US: Whether to fetch and include the worker session logs in the output
  - name: engine
    type: select
    required: false
    default: kiro
    form: form
    label:
      en_US: Engine
    human_description:
      en_US: Engine the task was submitted with (used for output labelling only)
    options:
      - value: kiro
        label:
          en_US: AWS Kiro
      - value: copilot
        label:
          en_US: GitHub Copilot CLI
      - value: claude
        label:
          en_US: Claude Code
output_schema:
  type: object
  properties:
    task_id:
      type: string
      description: Worker task identifier
    status:
      type: string
      description: Current task status (submitted, working, completed, failed, canceled, or error)
    success:
      type: boolean
      description: True when the task has completed successfully
    timed_out:
      type: boolean
      description: Always false for this tool (present for shape parity with delegate_task)
    error:
      type: string
      description: Error description when the task failed or could not be fetched
    prompt_summary:
      type: string
      description: Worker-generated one-line summary of the prompt
    result_summary:
      type: string
      description: Worker-generated summary of what the agent did
    stdout:
      type: string
      description: Truncated stdout from the coding agent CLI
    has_changes:
      type: boolean
      description: True when the agent pushed commits to a remote branch
    engine:
      type: string
      description: Engine label for the task
    agent:
      type: string
      description: Agent the worker used, when one was selected
    warnings:
      type: array
      items:
        type: string
      description: Always empty for this tool (present for shape parity with delegate_task)
    logs:
      type: string
      description: Combined worker session logs (prompt, setup, stdout/stderr) for follow-up steps
    log_files:
      type: array
      items:
        type: string
      description: Session log filenames on the worker
extra:
  python:
    source: tools/get_task_result.py
