identity:
  author: chalkboard
  name: kiro_delegator
  label:
    en_US: Kiro Task Delegator
  description:
    en_US: Delegate coding tasks to AWS Kiro (and other coding agent engines) via the kiro-github-worker, with results and session logs piped back into the workflow.
  icon: icon.svg
  tags:
    - productivity
    - utilities
credentials_for_provider:
  worker_base_url:
    type: text-input
    required: true
    label:
      en_US: Worker Base URL
    placeholder:
      en_US: https://rocky.example.com
    help:
      en_US: Base URL of the kiro-github-worker instance (the server that exposes /api/tasks and /api/logs).
  admin_api_token:
    type: secret-input
    required: false
    label:
      en_US: Admin API Token
    help:
      en_US: Bearer token matching the worker's ADMIN_API_TOKEN. Leave empty when the worker runs without admin authentication. Also used to authenticate the review API.
  review_base_url:
    type: text-input
    required: false
    label:
      en_US: Review API Base URL
    placeholder:
      en_US: https://rocky.example.com
    help:
      en_US: Base URL of the worker exposing /api/reviews (usually the same as the Worker Base URL). Required only when using the Request Human Review tool.
  review_app_url:
    type: text-input
    required: false
    label:
      en_US: Dashboard App URL
    placeholder:
      en_US: https://dashboard.example.com
    help:
      en_US: Optional base URL of the admin dashboard, used to build deep links to each review (e.g. https://dashboard.example.com/reviews?id=...).
tools:
  - tools/delegate_task.yaml
  - tools/submit_task.yaml
  - tools/get_task_result.yaml
  - tools/request_review.yaml
extra:
  python:
    source: provider/kiro_delegator.py
